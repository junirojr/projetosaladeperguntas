services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rocketq_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=rocketq_dev;Username=postgres;Password=postgres"
      Jwt__Secret: "dev-secret-minimum-32-characters-long!"
      Jwt__Issuer: "rocketq"
      Jwt__Audience: "rocketq-ui"
      Cors__AllowedOrigins__0: "http://localhost:3000"
    ports:
      - "5000:8080"
    depends_on:
      - postgres

  ui:
    build:
      context: ./apps/ui
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
